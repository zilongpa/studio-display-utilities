name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - name: Upload sdu.exe
        uses: actions/upload-artifact@v4
        with:
          name: sdu
          path: target/release/sdu.exe
          if-no-files-found: error

  # A tag like v0.2.0 also publishes the program as a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdu
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" sdu.exe --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
